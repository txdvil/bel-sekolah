<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker Bel Sekolah</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
  .wrap { min-height: 100%; display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; padding: 32px; align-items: center; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .left { text-align: center; }
  .clock { font-size: clamp(64px, 11vw, 170px); font-weight: 700; letter-spacing: 2px; font-variant-numeric: tabular-nums; line-height: 1; }
  .date { font-size: clamp(16px, 1.8vw, 24px); color: #94a3b8; margin: 12px 0 26px; }
  .nextbox { background: #1d4ed8; border-radius: 18px; padding: 18px 24px; display: inline-block; min-width: min(460px, 100%); }
  .nextbox.holiday { background: #7c2d12; }
  .nextbox .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; opacity: .8; }
  .nextbox .what { font-size: clamp(22px, 2.6vw, 34px); font-weight: 700; margin-top: 6px; }
  .nextbox .cd { font-size: clamp(16px, 1.8vw, 22px); margin-top: 6px; font-variant-numeric: tabular-nums; opacity: .9; }
  .playing { font-size: 24px; color: #fbbf24; margin-top: 18px; min-height: 32px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #94a3b8; margin-top: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #ef4444; }
  .dot.on { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
  .panel { background: #1e293b; border-radius: 18px; padding: 20px 22px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; font-weight: 600; }
  .item { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 12px; border-bottom: 1px solid #273449; }
  .item:last-child { border-bottom: 0; }
  .item .t { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .item .l { font-size: 19px; }
  .item .d { font-size: 13px; color: #94a3b8; }
  .item.first { background: #1d4ed8; border-bottom-color: transparent; }
  .item.first .d { color: #dbeafe; }
  .dayhead { font-size: 13px; color: #fbbf24; margin: 12px 0 4px 10px; text-transform: uppercase; letter-spacing: 1px; }
  .empty { color: #94a3b8; padding: 10px; }
  #unlock { position: fixed; inset: 0; background: rgba(15,23,42,.96); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 9; text-align: center; padding: 20px; }
  #unlock button { font-size: 26px; padding: 22px 44px; border: 0; border-radius: 14px; background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
  #unlock p { color: #94a3b8; max-width: 520px; line-height: 1.5; }
  .btn-stop { margin-top: 14px; background: transparent; color: #94a3b8; border: 1px solid #334155; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
  <div id="unlock">
    <button id="btnUnlock">🔊 Aktifkan Speaker</button>
    <p>Browser mewajibkan satu kali klik sebelum boleh memutar suara. Klik tombol di atas, lalu biarkan halaman ini tetap terbuka di komputer yang terhubung ke speaker.</p>
  </div>

  <div class="wrap">
    <div class="left">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
      <div class="nextbox" id="nextbox">
        <div class="lbl">Bel berikutnya</div>
        <div class="what" id="nextWhat">—</div>
        <div class="cd" id="countdown"></div>
      </div>
      <div class="playing" id="playing"></div>
      <div><span class="status"><span class="dot" id="dot"></span><span id="conn">Menghubungkan ke server…</span></span></div>
      <button class="btn-stop" id="btnStop">⏹ Hentikan suara</button>
    </div>
    <div class="panel">
      <h2>Jadwal bel berikutnya</h2>
      <div id="list"><div class="empty">Memuat…</div></div>
    </div>
  </div>

<script>
const audio = new Audio();
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
let offset = 0, next = null, holiday = false;

function tick() {
  const d = new Date(Date.now() + offset);
  $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('date').textContent = d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if (next && !holiday) {
    let s = Math.max(0, Math.round((next.at - d.getTime()) / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); s %= 60;
    $('countdown').textContent = 'dalam ' + (h ? `${h} jam ${pad(m)} menit` : `${pad(m)}:${pad(s)}`);
  } else $('countdown').textContent = '';
}
setInterval(tick, 1000); tick();

$('btnUnlock').onclick = async () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createBufferSource(); src.buffer = ctx.createBuffer(1, 1, 22050); src.connect(ctx.destination); src.start(0);
    audio.muted = true; audio.src = SILENT; await audio.play().catch(() => {}); audio.pause(); audio.muted = false;
  } catch (e) {}
  $('unlock').style.display = 'none';
};
// Jika Chrome dijalankan dengan --autoplay-policy=no-user-gesture-required, layar aktivasi dilewati otomatis
new Audio(SILENT).play().then(() => { $('unlock').style.display = 'none'; }).catch(() => {});

$('btnStop').onclick = () => { audio.pause(); audio.currentTime = 0; $('playing').textContent = ''; };
audio.onended = () => { $('playing').textContent = ''; };

function render(msg) {
  holiday = !!msg.holiday; next = msg.next;
  if (msg.serverTime) offset = msg.serverTime - Date.now();
  $('nextbox').classList.toggle('holiday', holiday);
  if (holiday) { $('nextWhat').textContent = '🏖️ Mode libur — bel otomatis nonaktif'; }
  else if (next) { $('nextWhat').textContent = `${next.time} · ${next.label || 'Bel'}${next.today ? '' : ' (' + next.day + ')'}`; }
  else { $('nextWhat').textContent = 'Tidak ada jadwal'; }

  const list = msg.upcoming || [];
  if (holiday) { $('list').innerHTML = '<div class="empty">Mode libur aktif. Bel otomatis tidak berbunyi.</div>'; tick(); return; }
  if (!list.length) { $('list').innerHTML = '<div class="empty">Belum ada jadwal aktif.</div>'; tick(); return; }
  let html = '', lastDay = null;
  list.forEach((b, i) => {
    const dayKey = b.today ? 'Hari ini' : b.day;
    if (dayKey !== lastDay) { if (!(i === 0 && b.today)) html += `<div class="dayhead">${esc(dayKey)}</div>`; lastDay = dayKey; }
    html += `<div class="item ${i === 0 ? 'first' : ''}"><div class="t">${b.time}</div><div><div class="l">${esc(b.label || 'Bel')}</div><div class="d">${esc(b.owner || '')}${b.owner ? ' · ' : ''}${esc((b.sound || '').replace(/\.[^.]+$/, ''))}</div></div></div>`;
  });
  $('list').innerHTML = html;
  tick();
}

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { $('dot').classList.add('on'); $('conn').textContent = 'Terhubung ke server — siap berbunyi'; };
  es.onerror = () => { $('dot').classList.remove('on'); $('conn').textContent = 'Terputus dari server, mencoba lagi…'; };
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'tick') render(msg);
    if (msg.type === 'play') {
      audio.pause();
      audio.src = '/sounds/' + encodeURIComponent(msg.file);
      audio.currentTime = 0;
      audio.play().catch(() => { $('playing').textContent = '⚠️ Gagal memutar: klik "Aktifkan Speaker" dulu'; $('unlock').style.display = 'flex'; });
      $('playing').textContent = `🔔 ${msg.reason} — ${msg.file.replace(/\.[^.]+$/, '')}`;
    }
    if (msg.type === 'stop') { audio.pause(); audio.currentTime = 0; $('playing').textContent = ''; }
  };
}
connect();

if ('wakeLock' in navigator) { const lock = () => navigator.wakeLock.request('screen').catch(() => {}); lock(); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && lock()); }
</script>
</body>
</html>
